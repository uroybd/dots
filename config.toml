#:schema https://raw.githubusercontent.com/uroybd/DotR/main/schema/config.schema.json
banner = false
symlink = false
prompt_backend = "bitwarden"

[packages.d_ghostty]
src = "dotfiles/d_ghostty"
dest = "~/.config/ghostty/"
dependencies = ["d_nushell", "d_zellij"]
pre_actions = ["{{ PACKAGE_INSTALLER }} --cask font-maple-mono"]
post_actions = ["pkill -SIGUSR2 ghostty"]

[packages.f_ssh_config]
src = "dotfiles/f_ssh_config"
dest = "~/.ssh/config"
dependencies = []

[packages.d_aerospace]
src = "dotfiles/d_aerospace"
dest = "~/.config/aerospace/"
dependencies = []
pre_actions = ["{{ PACKAGE_INSTALLER }} aerospace"]
post_actions = ["aerospace reload-config"]

[packages.d_carapace]
src = "dotfiles/d_carapace"
dest = "~/.config/carapace"
dependencies = []
pre_actions = ["{{ PACKAGE_INSTALLER }} carapace"]

[packages.d_carapace.targets]
mac = "~/Library/Application Support/carapace"

[packages.f_zshrc]
src = "dotfiles/f_zshrc"
dest = "~/.zshrc"
dependencies = []

[packages.f_zshrc.targets]
mac = "~/.zshrc"

[packages.d_zellij]
src = "dotfiles/d_zellij"
dest = "~/.config/zellij/"
dependencies = []
pre_actions = ["{{ PACKAGE_INSTALLER }} zellij"]

[packages.d_nvim]
src = "dotfiles/d_nvim"
dest = "~/.config/nvim/"
dependencies = []
pre_actions = ["{{ PACKAGE_INSTALLER }} neovim tectonic mermaid-cli"]
ignore = [".gitignore", ".git", ".git/**"]

[packages.f_gitconfig]
src = "dotfiles/f_gitconfig"
dest = "~/.gitconfig"
dependencies = []
pre_actions = ["{{ PACKAGE_INSTALLER }} git git-delta"]

[packages.d_task]
src = "dotfiles/d_task"
dest = "~/.config/task"
pre_actions = ["{{ PACKAGE_INSTALLER }} task taskwarrior-tui"]
post_actions = [
  "find ~/.config/task/hooks -name '*.dotrbak' -type f -print -delete | sed 's/^/[INFO] Removed backup: /'",
  "chmod +x ~/.config/task/hooks/* && echo '[INFO] Hooks are now executable.'",
]

[packages.d_task.prompts]
TW_CLIENT_ID = "TW_CLIENT_ID"
TW_ENCRYPTION_SECRET = "TW_ENCRYPTION_SECRET"
TW_ACCESS_KEY = "TW_ACCESS_KEY"
TW_SECRET_ACCESS_KEY = "TW_SECRET_ACCESS_KEY"
TW_BUCKET = "TW_BUCKET"


[packages.d_nushell]
src = "dotfiles/d_nushell"
dest = "~/.config/nushell"
dependencies = ["d_atuin", "d_carapace"]
pre_actions = [
  "{{ PACKAGE_INSTALLER }} nu direnv zoxide",
  "cargo install --locked prmt",
]
ignore = ["history.txt"]

[packages.d_nushell.targets]
mac = "~/Library/Application Support/nushell"

[packages.d_nushell.prompts]
TASKNOTES_TOKEN = "TASKNOTES TOKEN"
TW_BUCKET = "TW_BUCKET"

[packages.d_atuin]
src = "dotfiles/d_atuin"
dest = "~/.config/atuin/"
dependencies = []
pre_actions = ["{{ PACKAGE_INSTALLER }} atuin"]

[packages.d_bin]
src = "dotfiles/d_bin"
dest = "~/bin"
dependencies = []

[packages.d_bin.targets]
mac = "~/bin"

[packages.d_yazi]
src = "dotfiles/d_yazi"
dest = "~/.config/yazi/"
dependencies = []
pre_actions = ["{{ PACKAGE_INSTALLER }} yazi"]

[packages.d_vi_mongo]
src = "dotfiles/d_vi_mongo"
dest = "~/.config/vi-mongo/"
dependencies = []
pre_actions = [
  'command -v vi-mongo &> /dev/null || echo "[WARN] vi-mongo could not be found, install manually."',
]
ignore = ["history.txt"]

[packages.d_vi_mongo.targets]
mac = "~/Library/Application Support/vi-mongo"

[packages.d_jira]
src = "dotfiles/d_jira"
dest = "~/.config/.jira/"
dependencies = []
pre_actions = ["{{ PACKAGE_INSTALLER }} jira-cli"]

[packages.d_jira.prompts]
JIRA_EMAIL = "JIRA EMAIL"
JIRA_HOST = "JIRA HOST"
JIRA_API_TOKEN = "JIRA API TOKEN"

[profiles.default]
dependencies = [
  "d_zellij",
  "d_nvim",
  "d_aerospace",
  "f_gitconfig",
  "d_ghostty",
  "d_atuin",
  "d_jira",
  "f_ssh_config",
  "d_yazi",
  "f_zshrc",
  "d_bin",
  "d_nushell",
  "d_carapace",
  "d_vi_mongo",
  "d_task",
]
platform = "mac"

[platforms.mac]
pre_actions = ["./scripts/install_homebrew.sh"]

[platforms.mac.variables]
PACKAGE_INSTALLER = "brew install"
