# yaml-language-server: $schema=https://carapace.sh/schemas/command.json
#
# Carapace spec for Taskwarrior's `task`.
#
# carapace ships a native `task` completer for go-task (taskfile.dev) that
# shadows the CARAPACE_BRIDGES lookup, and taskwarrior's zsh/bash completion
# can't be reached through the bridges, so complete from taskwarrior itself
# (`task _ids`, `_projects`, `_tags`, `_udas`, `_config`, `_context`).
#
# Taskwarrior's grammar is `task [filter] <command> [modifications]` with the
# command allowed anywhere, so flag parsing is disabled (`-tag`, `rc.x=y` are
# plain arguments) and every position offers ids, `attribute:value` pairs and
# `+tag`/`-tag`.
#
# Generated command list: `task _zshcommands`.
name: task
description: Taskwarrior, a command-line task manager
parsing: disabled

x-ids: &ids |-
  $(task _zshids 2>/dev/null | awk -F: '{v=$1; sub(/^[^:]*:/,""); printf "%s\t%s\n", v, $0}')

# `key:value` pairs, completed as multiparts so `pro<TAB>` gives `project:`
# and `project:<TAB>` gives the project names.
x-attributes: &attributes |-
  $(task _projects 2>/dev/null | sed 's/^/project:/'; task _ids 2>/dev/null | sed 's/^/depends:/'; for p in H M L; do echo "priority:$p"; done; for s in pending completed deleted waiting recurring; do echo "status:$s"; done; for r in daily weekdays weekly biweekly monthly quarterly semiannual annual yearly; do echo "recur:$r"; done; for k in due wait scheduled until start end entry modified; do for d in now today yesterday tomorrow sod eod sow eow soww eoww som eom soq eoq soy eoy later someday monday tuesday wednesday thursday friday saturday sunday; do echo "$k:$d"; done; done; for k in description parent template; do echo "$k:"; done; task _udas 2>/dev/null | grep -v -x priority | sed 's/$/:/') ||| $multiparts([":"])

x-tags: &tags |-
  $(task _tags 2>/dev/null | sed 's/^/+/'; task _tags 2>/dev/null | grep -v -x '[A-Z]*' | sed 's/^/-/')

x-commands: &commands |-
  $(task _zshcommands 2>/dev/null | grep -v '^_' | awk -F: '{print $1"\t"$3}'; printf 'fail\tMarks tasks outcome:failed and done\n')

# `rc.<setting>=<value>` overrides, only offered once `rc` has been typed.
x-overrides: &overrides |-
  $(case "${C_VALUE}" in rc*) task _config 2>/dev/null | sed 's/^/rc./;s/$/=/';; esac) ||| $nospace(=)

completion:
  positionalany: [*commands, *ids, *attributes, *tags, *overrides]
commands:
  - name: commands
    description: "Generates a list of all commands, with behavior details"
    group: metadata

  - name: count
    description: "Counts matching tasks"
    group: metadata
    completion:
      positionalany: [*commands, *ids, *attributes, *tags, *overrides]

  - name: ids
    description: "Shows the IDs of matching tasks, as a range"
    group: metadata
    completion:
